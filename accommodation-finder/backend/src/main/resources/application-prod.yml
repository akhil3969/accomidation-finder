# Production profile - every secret comes from the environment.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

app:
  seed:
    enabled: false

logging:
  level:
    root: WARN
    com.accommodationfinder: INFO
