# Runs on every push and pull request: backend tests (unit + integration), frontend
# lint and production build. A red X here means do not merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - mvn verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Surefire runs *Test/*Tests, Failsafe runs *IT. Both use the in-memory H2
      # "test" profile, so no database service is needed.
      - name: Test
        run: mvn -B -ntp verify

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint (zero warnings allowed)
        run: npm run lint
      - name: Production build
        run: npm run build

  backup-restore-drill:
    name: Backup and restore drill (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: drill-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdrill-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        # Explicit bash gives -eo pipefail: without it `script | tee` reports tee's
        # success even when the script fails, which once hid a broken backup step.
        shell: bash
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: drill-only-password
      MYSQL_PWD: drill-only-password
    steps:
      - uses: actions/checkout@v5

      - name: Build a database from the real migrations, with a known row
        run: |
          mysql -h127.0.0.1 -uroot -e "CREATE DATABASE drill"
          mysql -h127.0.0.1 -uroot drill < backend/src/main/resources/db/migration/V1__initial_schema.sql
          mysql -h127.0.0.1 -uroot drill -e "INSERT INTO users (name, email, password, role, verification_status)
            VALUES ('Drill User', 'drill@example.com', 'x', 'TENANT', 'NOT_SUBMITTED')"

      - name: Back up
        run: DB_NAME=drill scripts/backup-db.sh "$RUNNER_TEMP/backups" | tee "$RUNNER_TEMP/backup-path"

      - name: Restore into an empty database and compare
        run: |
          backup="$(cat "$RUNNER_TEMP/backup-path")"
          DB_NAME=drill_restored scripts/restore-db.sh "$backup"
          tables() { mysql -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$1'"; }
          [ "$(tables drill)" = "$(tables drill_restored)" ] || { echo "table count differs"; exit 1; }
          email="$(mysql -h127.0.0.1 -uroot -N drill_restored -e "SELECT email FROM users")"
          [ "$email" = "drill@example.com" ] || { echo "row missing after restore"; exit 1; }

      - name: Refuses to restore over a database that has tables
        run: |
          if DB_NAME=drill_restored scripts/restore-db.sh "$(cat "$RUNNER_TEMP/backup-path")"; then
            echo "restore-db should have refused"; exit 1
          fi
