spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: false        # MySQL-only SQL; see MySqlMigrationIT
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-long-enough-32
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: false
  # Every MockMvc request comes from 127.0.0.1, so the real limits would trip
  # across unrelated tests. RateLimitTests switches them back on for itself.
  rate-limit:
    enabled: false
  # The email job must only run when a test calls it, never on a background timer
  # halfway through another test.
  notifications:
    email-check-interval: 3600000
