# Zero-setup profile: in-memory H2 database, auto-seeded with demo data.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  datasource:
    url: jdbc:h2:mem:accommodation;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false
  # The migrations are MySQL SQL; the in-memory demo builds its schema from the
  # entities instead (create-drop above). MySQL coverage is MySqlMigrationIT.
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Throwaway secret so the demo runs with zero setup. It is public, so
    # ProductionConfigGuard refuses to start the prod profile with it.
    secret: ${JWT_SECRET:demo-only-insecure-jwt-secret-do-not-use-in-production}
  seed:
    enabled: true
