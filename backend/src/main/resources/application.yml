# ---------------------------------------------------------------
# Accommodation Finder - default configuration
# Active profile is chosen with:  -Dspring-boot.run.profiles=demo|dev|prod
# ---------------------------------------------------------------
spring:
  # backend/.env is read when present, so database credentials and the JWT
  # secret can live in a gitignored file instead of in this one. `optional:`
  # means nothing breaks when the file is absent, which is the normal case for
  # the demo profile and for CI.
  config:
    import: optional:file:./.env[.properties]
  application:
    name: accommodation-finder
  profiles:
    default: demo
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # No default on purpose: a missing JWT_SECRET must stop startup, not fall
    # back to a value anyone can read on GitHub. Must be at least 32 characters.
    # Generate one with:  openssl rand -base64 48
    # The demo profile supplies its own throwaway value in application-demo.yml.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 h
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  seed:
    enabled: true
  # One-shot creation of the first admin on an empty production database.
  # Ignored once any admin exists; see config/AdminBootstrap.java.
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Administrator}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.accommodationfinder: INFO
