# ---------------------------------------------------------------
# Accommodation Finder - default configuration
# Active profile is chosen with:  -Dspring-boot.run.profiles=demo|dev|prod
# ---------------------------------------------------------------
spring:
  # backend/.env is read when present, so database credentials and the JWT
  # secret can live in a gitignored file instead of in this one. `optional:`
  # means nothing breaks when the file is absent, which is the normal case for
  # the demo profile and for CI.
  config:
    import: optional:file:./.env[.properties]
  application:
    name: accommodation-finder
  profiles:
    default: demo
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        # Without a cap, GET /api/rooms?size=1000000 loads the whole table.
        max-page-size: 100
  # SMTP. Nothing here turns it on: set SPRING_MAIL_HOST (plus _PORT, _USERNAME,
  # _PASSWORD) in the environment - e.g. smtp-relay.brevo.com:587. Without a host,
  # emails are written to the log instead (see MailGateway).
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # No default on purpose: a missing JWT_SECRET must stop startup, not fall
    # back to a value anyone can read on GitHub. Must be at least 32 characters.
    # Generate one with:  openssl rand -base64 48
    # The demo profile supplies its own throwaway value in application-demo.yml.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 h
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173}
  seed:
    enabled: true
  # Where email links point. The SPA routes /verify-email and /reset-password.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:AccomFinder <no-reply@accomfinder.app>}
    log-body: true            # log emails when no SMTP is configured (off in prod)
  notifications:
    # Unread for this long -> included in an email digest. Read in time -> no email.
    email-delay: ${NOTIFICATION_EMAIL_DELAY:10m}
    email-check-interval: 60000
  legal:
    # Bump when the terms or privacy policy change; stored per user at sign-up.
    terms-version: "2026-10"
  retention:
    read-notifications: 90d
    expired-tokens: 7d
  # Per-IP limits on auth endpoints (RateLimitFilter) and per-user limits on chat.
  rate-limit:
    enabled: true
    login:       { limit: 5,  window: 1m }
    register:    { limit: 3,  window: 1h }
    email-flows: { limit: 5,  window: 1h }
    messages:    { limit: 20, window: 1m }
  # One-shot creation of the first admin on an empty production database.
  # Ignored once any admin exists; see config/AdminBootstrap.java.
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Administrator}

# Health only: /actuator/health (plus /liveness and /readiness for the host).
# No details to anonymous callers - they would reveal the database and mail setup.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # An SMTP outage must not mark the app DOWN and get it restarted in a loop;
    # emails retry on their own (resend link, next digest run).
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.accommodationfinder: INFO
