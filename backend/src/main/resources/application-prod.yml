# Production profile - every secret comes from the environment.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: false

server:
  # Trust X-Forwarded-For / X-Forwarded-Proto from the reverse proxy, so rate limits
  # see the real client IP and redirects keep https. Only safe behind a proxy that
  # overwrites these headers - which every managed host (Render, Railway, Fly) does.
  forward-headers-strategy: framework
  # Spring's fallback /error page must not echo exception text, stack traces or
  # binding details back to the client - they describe the internals to an attacker.
  # GlobalExceptionHandler already returns its own safe messages for known errors.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

app:
  seed:
    enabled: false
  mail:
    # Verification and reset links are credentials - never write them to logs.
    log-body: false

logging:
  level:
    root: WARN
    com.accommodationfinder: INFO
    # SQL and bound parameters contain names, emails and messages (personal data).
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
